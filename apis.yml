apis:
  - aid: lindy:lindy
    name: Lindy
    description: >-
      Lindy's callable surface. There is no public REST API and no published
      OpenAPI. The one documented HTTP endpoint is an inbound webhook trigger at
      https://public.lindy.ai/api/v1/webhooks/[unique-id], authenticated with a
      per-webhook bearer secret generated in the Lindy UI; a POST to it starts
      an agent task and the whole request body, headers and query string are
      handed to the workflow. Alongside it Lindy's documentation host serves a
      live anonymous MCP server and an A2A agent card.
    humanURL: https://www.lindy.ai
    baseURL: https://public.lindy.ai/api/v1
    baseURLSource: >-
      Named by Lindy's own documentation at
      https://docs.lindy.ai/skills/by-lindy/webhooks — "Each webhook gets a
      unique URL in the format https://public.lindy.ai/api/v1/webhooks/[unique-id]".
      The host resolves and serves; unauthenticated paths return 404.
    tags:
      - AI Automation
      - Webhooks
    properties:
      - type: Documentation
        url: https://docs.lindy.ai
      - type: Webhooks
        url: asyncapi/lindy-webhooks.yml
      - type: Authentication
        url: authentication/lindy-authentication.yml
