aid: lindy
name: Lindy
description: >-
  Lindy is an AI automation platform for building and running AI agents that do
  real work across a company's tools. The current product, Lindy Teammate, lives
  in Slack and handles inbox triage and drafting, meeting recording, notes and
  scheduling, daily briefs and scheduled routines, backed by an agent builder
  that turns a natural-language prompt into a working agent and connects to
  thousands of third-party apps through OAuth integrations, stored credentials
  and any hosted MCP server. Lindy publishes no public REST API contract: its
  machine-readable surface is agent-native rather than contract-native — a live
  anonymous MCP server and a conformant A2A agent card on its documentation
  host, a published Agent Skill, llms.txt on two hosts, and a single
  bearer-authenticated inbound webhook endpoint that triggers an agent workflow.
