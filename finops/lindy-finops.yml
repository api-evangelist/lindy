specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Lindy
providerId: lindy
publisherName: Lindy
serviceCategory: API
created: '2026-05-04'
# Framework mapping written by the API Evangelist bulk sweep dated 2026-05-04.
# The billingModel, focusColumns, meters and apis blocks were corrected against
# Lindy's published pricing on 2026-08-29 (see plans/lindy-plans-pricing.yml):
# Lindy bills per seat with a shared credit pool, NOT per API request. The
# framework/domains/principles scaffold below remains generated.
method: derived
modified: '2026-08-29'
generated: '2026-08-29'
source: https://docs.lindy.ai/pricing
tags:
  - AI Agents
  - AI Automation
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Lindy API surface. Provides a FOCUS-aligned mapping for
  cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Committed seat subscription with usage-metered credits
  billingFrequency: Monthly
  billingCurrency: USD
  seatPrice:
    Plus: '30.00'
    Pro: '100.00'
    Max: '200.00'
    Enterprise: custom
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Lindy
  ServiceCategory: Developer Tools / API
  ProviderName: Lindy
  PublisherName: Lindy
  InvoiceIssuerName: Lindy
  PricingCategory: Committed seat subscription with usage-metered credits
  PricingUnit: credit
  PricingUnitNote: >-
    A credit is worth approximately USD 0.01 and is consumed only when Lindy
    performs work. Credits are allotted per user and pooled across the
    workspace. Source https://docs.lindy.ai/pricing.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: credits
    description: >-
      The single metered unit Lindy publishes. Everyday asks consume 2-250
      credits, deep work 250-1,000, big builds 1,000-2,500.
    unit: credit
    aggregation: sum
    dimensions:
      - user
      - workspace
      - task
  - name: seats
    description: Billable users on the workspace
    unit: user
    aggregation: count
    dimensions:
      - workspace
      - plan
  - name: connected_inboxes
    description: Mail accounts connected per user; capped by plan (2 / 3 / 5)
    unit: inbox
    aggregation: count
    dimensions:
      - user
      - plan
apis:
  - name: Lindy
    baseURL: https://public.lindy.ai/api/v1
    tags:
      - AI Automation
    serviceName: Lindy
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Credits
    metric: billed_cost / (credits / 1000)
    published: >-
      Plus USD 10.00, Pro USD 6.67, Max USD 5.71 per 1,000 credits at list
      price, derived from the published seat price and credit allotment.
  - name: Cost per Seat
    metric: billed_cost / active_users
    published: 'Plus 30, Pro 100, Max 200 USD per user per month'
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
