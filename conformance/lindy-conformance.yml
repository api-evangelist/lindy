    info_title: OpenAPI Plant Store
    servers:
      - http://sandbox.mintlify.com
    size_bytes: 2709
    operations: 3
    verdict: >-
      STEP 0c ownership check FAILED. This is Mintlify's stock starter template
      — a plant-store sample API on sandbox.mintlify.com. It says nothing about
