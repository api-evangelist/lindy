provider: Lindy
providerId: lindy
description: >-
  Standards and compliance posture for Lindy. Compliance is well published and
  independently audited. Cross-cutting API standards are almost entirely absent
  because Lindy publishes no OpenAPI, no GraphQL schema and no REST reference —
  the machine-readable surface it does publish is agent-native (MCP, A2A,
  llms.txt, Agent Skill), not contract-native.
