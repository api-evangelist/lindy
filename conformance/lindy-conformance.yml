standards:
  - id: mcp
    name: Model Context Protocol
    conforms: true
    role: server and client
    evidence:
      - >-
        Server — https://docs.lindy.ai/mcp answers a JSON-RPC 2.0 tools/list
        over streamable HTTP with three tools carrying inputSchema and
        annotations (200, 2026-08-29). Advertised at
        https://docs.lindy.ai/.well-known/mcp.json.
      - >-
        Client — https://docs.lindy.ai/integrations/mcp documents connecting
        Lindy agents to any hosted MCP server over a public HTTPS
        streamable-HTTP endpoint, reading the tool catalog and generating one
        agent action per supported tool.
  - id: a2a
    name: Agent2Agent Protocol
    conforms: true
    version_declared: '0.3'
    evidence:
      - >-
        https://docs.lindy.ai/.well-known/agent-card.json (200) parses as an
        AgentCard and grades conformant against A2A 1.0.0 hard checks. See
        a2a/lindy-a2a.yml.
  - id: agent-skills
    name: Agent Skills
    conforms: true
    evidence:
      - >-
        https://docs.lindy.ai/.well-known/agent-skills/lindyai/skill.md (200,
        text/markdown) — frontmatter name/description plus markdown body. Saved
        verbatim to skills/lindy-lindyai.md.
  - id: llms-txt
    name: llms.txt
    conforms: true
    evidence:
      - https://docs.lindy.ai/llms.txt (200)
      - https://www.lindy.ai/llms.txt (200)
  - id: openapi
    name: OpenAPI
    conforms: false
    evidence:
      - See contract_discovery above — no first-party OpenAPI published.
  - id: asyncapi
    name: AsyncAPI
    conforms: false
    evidence:
      - >-
        Webhooks are documented in prose only
        (https://docs.lindy.ai/skills/by-lindy/webhooks, 200); no AsyncAPI
        document exists on any host or in the public GitHub org.
  - id: rfc9457
    name: 'RFC 9457 Problem Details for HTTP APIs'
    conforms: false
    evidence:
      - No error reference is published; no application/problem+json surface observed.
  - id: rfc8594
    name: 'RFC 8594 Sunset HTTP Header'
    conforms: false
    evidence:
      - No deprecation or sunset policy published. See lifecycle/lindy-lifecycle.yml.
  - id: oauth2
    name: OAuth 2.0
    conforms: partial
    evidence:
      - >-
        Lindy is an OAuth *client*: https://docs.lindy.ai/integrations/overview
        documents connecting third-party tools with OAuth or an API key. Lindy
        publishes no OAuth authorization server of its own —
        /.well-known/oauth-authorization-server 404s on every host.
  - id: scim
    name: SCIM
    conforms: partial
    evidence:
      - >-
        https://docs.lindy.ai/pricing lists "SSO and SCIM" as an Enterprise-tier
        feature. No SCIM schema URN, endpoint or configuration document is
        published, so the conformance is a plan-page claim, not a contract.
  - id: idempotency
    name: Idempotency keys
    conforms: false
    evidence:
      - >-
        No idempotency header or key documented. The three live MCP tools carry
        MCP annotations instead — two set idempotentHint true, submit_feedback
        sets it false.
domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY check, deliberately left empty. Lindy's market — general-purpose
    AI agents and workplace automation — has no established domain data standard
    of the SCIM/OData/OpenRTB/HL7/OneRoster class. The nearest thing to a domain
    standard for this market is MCP + A2A + Agent Skills, all three of which
    Lindy publishes and which are recorded under standards[] above.
