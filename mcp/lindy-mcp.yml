generated: '2026-08-29'
method: probed
source: https://docs.lindy.ai/mcp
provider: Lindy
providerId: lindy
name: Lindy Documentation MCP Server
description: >-
  A live, anonymous, remote MCP server on Lindy's own documentation host. It is a
  documentation-retrieval server generated by the Mintlify platform that runs
  docs.lindy.ai, not a server over the Lindy product. It exposes documentation
  search, a read-only virtual filesystem over the published docs pages, and a
  feedback submission tool. Lindy publishes no MCP server over its agent
  platform itself; Lindy is instead an MCP *client* — its agent builder connects
  to third-party hosted MCP servers and turns their tools into agent actions
  (https://docs.lindy.ai/integrations/mcp).
deployment:
  mode: remote
  endpoint: https://docs.lindy.ai/mcp
  auth: none
  verified: probed
discovery:
  well_known: https://docs.lindy.ai/.well-known/mcp.json
  well_known_saved: well-known/lindy-mcp.json
  declared_url: https://lindyai.main-kill-isr.mintlify.me/mcp
  note: >-
    /.well-known/mcp.json advertises the Mintlify preview host
    lindyai.main-kill-isr.mintlify.me. Both that URL and the vanity path
    https://docs.lindy.ai/mcp answer tools/list with an identical tool set; the
    vanity path on Lindy's own host is recorded as the endpoint.
transport: streamable-http
protocol: mcp
status: live
x-evidence:
  fetched: '2026-08-29'
  method: 'POST tools/list (jsonrpc 2.0)'
  url: https://docs.lindy.ai/mcp
  http_status: 200
  content_type: text/event-stream
  tools_returned: 3
  raw: mcp/lindy-mcp-tools.json
tools:
  - name: search_lindy_documentation
    title: Search documentation
    description: >-
      Search across the Lindy Documentation knowledge base to find relevant
      information, code examples, API references, and guides.
    inputSchema:
      query: string (required)
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: query_docs_filesystem_lindy_documentation
    description: >-
      Read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail,
      stat, wc, sort, uniq, cut, sed, awk, jq) against a virtualized in-memory
      filesystem containing only the Lindy documentation pages and OpenAPI specs.
      Stateless; no writes, no network, no process control.
    inputSchema:
      command: string (required)
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: submit_feedback
    description: Report a problem with this documentation site so the docs team can fix it.
    inputSchema:
      path: string (required)
      feedback: string (required)
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: true
crosswalk: none
crosswalk_reason: >-
  No tool crosswalk is emitted. A crosswalk binds MCP tools to backing OpenAPI
  operationIds, and Lindy publishes no OpenAPI for its own API surface — see the
  contract-discovery record in conformance/lindy-conformance.yml. These three
  tools have no REST counterpart at all; they are documentation-platform tools.
