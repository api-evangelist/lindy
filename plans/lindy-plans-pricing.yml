specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Lindy
providerId: lindy
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: https://docs.lindy.ai/pricing
docs:
  - https://docs.lindy.ai/pricing
  - https://www.lindy.ai/pricing
  - https://docs.lindy.ai/account-billing/usage
tags:
  - AI Agents
  - AI Automation
  - Pricing
description: >-
  Lindy's published plans, read verbatim from the pricing page on 2026-08-29.
  This file replaces a 2026-05-04 bulk-sweep scaffold whose Free/Professional/
  Enterprise tiers and per-minute request quotas were invented and matched
  nothing Lindy publishes. Lindy prices per user per month with a shared
  workspace pool of credits; there is no free tier, no per-request API price and
  no published API rate plan, because Lindy sells a product rather than API
  calls.
plan_count: 4
pricing_model: per-seat subscription with a shared credit pool
billing_period: monthly
billing_currency: USD
free_tier: false
trial: >-
  A free trial is offered from the site ("Try for free", https://chat.lindy.ai/signup);
  the pricing page states a free week for new teammates joining a workspace but
  publishes no standalone free plan.
credit_unit:
  name: credit
  approximate_value_usd: 0.01
  basis: >-
    "Credits measure the work Lindy does, about one cent each. You only spend
    them when Lindy is actually working, and bigger jobs use more."
  consumption_bands:
    - band: Everyday asks
      credits: 2-250
      examples: Answers, summaries, lookups, updates in your tools, closing out a meeting, drafting a reply
    - band: Deep work
      credits: 250-1000
      examples: Researching a competitor and writing the report, triaging a day's support queue, turning a week of calls into a proposal
    - band: Big builds
      credits: 1000-2500
      examples: Dashboards and decks from CRM and analytics, internal tools shipped end to end
plans:
  - id: lindy-plus
    name: Plus
    type: paid
    price: '30.00'
    currency: USD
    period: month
    unit: per user
    description: Getting started. Standard usage.
    entries:
      - label: Credits
        name: credits
        type: quota
        metric: credits
        limit: 3000
        timeFrame: month
        unit: per user, pooled across the workspace
        price: '0.00'
        userMultiplied: true
      - label: Connected inboxes
        name: connected_inboxes
        type: quota
        metric: inboxes
        limit: 2
        timeFrame: concurrent
    elements:
      - name: Slack-native teammate in threads and mentions
      - name: Scheduled routines
      - name: Persistent workspace context
      - name: iMessage with Lindy, 24/7
      - name: Manages your inbox and drafts in your voice
      - name: Meeting scheduling, prep, and follow-up
      - name: Meeting recording and note taking
      - name: Thousands of integrations
      - name: Model selection, all models
  - id: lindy-pro
    name: Pro
    type: paid
    price: '100.00'
    currency: USD
    period: month
    unit: per user
    description: Daily delegation. Roughly 5x the usage of Plus.
    entries:
      - label: Credits
        name: credits
        type: quota
        metric: credits
        limit: 15000
        timeFrame: month
        unit: per user, pooled across the workspace
        price: '0.00'
        userMultiplied: true
      - label: Connected inboxes
        name: connected_inboxes
        type: quota
        metric: inboxes
        limit: 3
        timeFrame: concurrent
    elements:
      - name: Everything in Plus
      - name: Computer use
  - id: lindy-max
    name: Max
    type: paid
    price: '200.00'
    currency: USD
    period: month
    unit: per user
    description: Running your whole work life through Lindy. Roughly 11x the usage of Plus.
    entries:
      - label: Credits
        name: credits
        type: quota
        metric: credits
        limit: 35000
        timeFrame: month
        unit: per user, pooled across the workspace
        price: '0.00'
        userMultiplied: true
      - label: Connected inboxes
        name: connected_inboxes
        type: quota
        metric: inboxes
        limit: 5
        timeFrame: concurrent
    elements:
      - name: Everything in Pro
  - id: lindy-enterprise
    name: Enterprise
    type: enterprise
    price: custom
    currency: USD
    period: month
    unit: contact sales
    description: Teams with security and compliance needs. Custom credits and usage.
    contact: https://www.lindy.ai/contact-sales
    entries:
      - label: Credits
        name: credits
        type: quota
        metric: credits
        limit: -1
        timeFrame: month
        price: custom
      - label: Connected inboxes
        name: connected_inboxes
        type: quota
        metric: inboxes
        limit: 5
        timeFrame: concurrent
    elements:
      - name: Everything in Max
      - name: SSO and SCIM
notes:
  - >-
    No API-specific plan exists. Lindy publishes no public REST API product, so
    there is no per-call price, no API tier and no developer plan to record.
  - >-
    Overage behaviour is described qualitatively on
    https://docs.lindy.ai/account-billing/usage rather than as a published
    per-unit overage rate; no overage price is recorded here because none is
    published.
maintainers:
